<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background-color: #0d1117; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="hostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#21262d" />
    </linearGradient>
    <linearGradient id="sandboxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2128" />
      <stop offset="100%" stop-color="#2d333b" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#1158c7" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff" />
    </marker>
  </defs>

  <!-- Host Container -->
  <rect x="20" y="20" width="760" height="230" rx="10" fill="url(#hostGrad)" stroke="#30363d" stroke-width="2"/>
  <text x="40" y="48" fill="#8b949e" font-size="14" font-weight="bold" letter-spacing="1">HOST ENVIRONMENT (ELECTRON APP)</text>

  <!-- Nodes in Host -->
  <rect x="50" y="70" width="160" height="50" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="130" y="100" fill="#c9d1d9" font-size="13" text-anchor="middle" font-weight="600">React Renderer UI</text>

  <rect x="270" y="70" width="180" height="50" rx="6" fill="url(#nodeGrad)" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="360" y="100" fill="#ffffff" font-size="13" text-anchor="middle" font-weight="600">Electron Main Process</text>

  <rect x="520" y="70" width="150" height="50" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <text x="595" y="100" fill="#c9d1d9" font-size="13" text-anchor="middle">Git Service</text>

  <rect x="270" y="145" width="180" height="45" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <text x="360" y="172" fill="#c9d1d9" font-size="12" text-anchor="middle">Staging Service</text>

  <rect x="270" y="200" width="180" height="40" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="360" y="225" fill="#79c0ff" font-size="12" text-anchor="middle" font-weight="600">Agent Invoker</text>

  <!-- Host Arrows -->
  <line x1="210" y1="95" x2="262" y2="95" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="95" x2="512" y2="95" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="120" x2="360" y2="137" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="190" x2="360" y2="192" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Subprocess execution line -->
  <line x1="360" y1="240" x2="360" y2="280" stroke="#f0883e" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="375" y="265" fill="#f0883e" font-size="11" font-family="monospace">run-agent . -p "..."</text>

  <!-- Sandbox Container -->
  <rect x="20" y="280" width="760" height="200" rx="10" fill="url(#sandboxGrad)" stroke="#30363d" stroke-width="2"/>
  <text x="40" y="308" fill="#8b949e" font-size="14" font-weight="bold" letter-spacing="1">ISOLATED CONTAINER SANDBOX (PODMAN / DOCKER / COLIMA)</text>

  <!-- Nodes in Sandbox -->
  <rect x="250" y="325" width="220" height="40" rx="6" fill="#21262d" stroke="#38d878" stroke-width="1.5"/>
  <text x="360" y="350" fill="#38d878" font-size="13" text-anchor="middle" font-weight="600">Agentic Environment</text>

  <rect x="250" y="380" width="220" height="40" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <text x="360" y="405" fill="#c9d1d9" font-size="12" text-anchor="middle">AST Tools (madge, ts-morph)</text>

  <rect x="250" y="432" width="220" height="38" rx="6" fill="#21262d" stroke="#e3b341" stroke-width="1.5"/>
  <text x="360" y="455" fill="#e3b341" font-size="12" text-anchor="middle">/workspace/reports/code_smells.md</text>

  <!-- Sandbox Arrows -->
  <line x1="360" y1="365" x2="360" y2="372" stroke="#38d878" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="420" x2="360" y2="424" stroke="#38d878" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Report feedback loop -->
  <path d="M 250 450 Q 130 450 130 128" fill="none" stroke="#e3b341" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
</svg>

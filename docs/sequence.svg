<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background-color: #0d1117; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38d878" />
    </marker>
  </defs>

  <!-- Lifelines Header -->
  <rect x="60" y="30" width="180" height="40" rx="6" fill="#1f6feb" stroke="#58a6ff" stroke-width="1"/>
  <text x="150" y="55" fill="#ffffff" font-size="13" text-anchor="middle" font-weight="600">React Renderer (UI)</text>

  <rect x="310" y="30" width="180" height="40" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="400" y="55" fill="#c9d1d9" font-size="13" text-anchor="middle" font-weight="600">Main Process (AgentInvoker)</text>

  <rect x="560" y="30" width="180" height="40" rx="6" fill="#21262d" stroke="#38d878" stroke-width="1"/>
  <text x="650" y="55" fill="#38d878" font-size="13" text-anchor="middle" font-weight="600">Container Sandbox</text>

  <!-- Vertical Lifeline Lines -->
  <line x1="150" y1="70" x2="150" y2="390" stroke="#30363d" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="400" y1="70" x2="400" y2="390" stroke="#30363d" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="650" y1="70" x2="650" y2="390" stroke="#30363d" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Step 1: UI -> Main -->
  <line x1="150" y1="110" x2="392" y2="110" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="275" y="103" fill="#c9d1d9" font-size="12" text-anchor="middle">1. Trigger Code Review</text>

  <!-- Step 2: Main -> Container -->
  <line x1="400" y1="150" x2="642" y2="150" stroke="#f0883e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="525" y="143" fill="#f0883e" font-size="12" text-anchor="middle">2. Spawn run-agent . -p "..."</text>

  <!-- Loop box: Real-Time Execution -->
  <rect x="110" y="180" width="580" height="110" rx="6" fill="#161b22" opacity="0.8" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="125" y="200" fill="#8b949e" font-size="11" font-weight="bold">LOOP: Real-Time Execution</text>

  <!-- Step 3 & 4 inside loop -->
  <line x1="650" y1="220" x2="408" y2="220" stroke="#38d878" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="525" y="213" fill="#38d878" font-size="12" text-anchor="middle">3. stdout / stderr log chunks</text>

  <line x1="400" y1="255" x2="158" y2="255" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="275" y="248" fill="#58a6ff" font-size="12" text-anchor="middle">4. IPC Stream (review:log)</text>
  <text x="275" y="275" fill="#8b949e" font-size="11" font-style="italic" text-anchor="middle">Human Monitoring &amp; Retrospective Debugging</text>

  <!-- Step 5: Container -> Main -->
  <line x1="650" y1="320" x2="408" y2="320" stroke="#e3b341" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="525" y="313" fill="#e3b341" font-size="12" text-anchor="middle">5. Exit Code 0 &amp; Report Written</text>

  <!-- Step 6: Main -> UI -->
  <line x1="400" y1="360" x2="158" y2="360" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="275" y="353" fill="#c9d1d9" font-size="12" text-anchor="middle">6. Display Sanitised Report</text>
</svg>
